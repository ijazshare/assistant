# Version catalog for Assistant.
#
# Every version here was resolved against live Maven metadata (maven.google.com /
# repo1.maven.org) on 2026-09-01 rather than from memory - see PROGRESS.md for the
# recorded evidence. Prefer bumping via Dependabot PRs so the change is reviewable.

[versions]
# ---- Build toolchain ----
agp = "9.4.1"
kotlin = "2.4.10"

# ---- Android platform ----
# API 37 = Android 17. AGP 9.4.0 caps out at API 37, so this is the ceiling.
# NOTE: there is no bare "platforms;android-37" SDK package - only android-37.0/.1/.2.
# AGP resolves compileSdk = 37 to the highest installed 37.x platform.
compileSdk = "37"
targetSdk = "37"
minSdk = "33"
buildTools = "36.0.0"  # AGP 9.4.0 minimum AND default
ndk = "29.0.14206865"  # r29. AGP 9.4.0 *defaults* to 28.2.13676358, but that is a
# default rather than a ceiling, and the current cmdline-tools "android sdk install"
# refuses to side-install an older NDK once r29 is present. r29 was verified locally to
# build an arm64-v8a .so with Clang 21 and 16 KB page alignment. Revisit if P1 hits a
# whisper.cpp/llama.cpp incompatibility.
cmake = "3.31.6"

# ---- Kotlin ecosystem ----
coroutines = "1.11.0"
serializationJson = "1.11.0"

# ---- AndroidX / Jetpack ----
composeBom = "2026.08.00"
androidxCore = "1.19.0"
androidxActivity = "1.13.0"
androidxLifecycle = "2.11.0"
androidxDatastore = "1.2.1"
androidxWork = "2.11.2"

# ---- Networking (model downloads only - see Privacy invariants in CLAUDE.md) ----
okhttp = "5.5.0"
commonsCompress = "1.28.0"

# ---- Static analysis / formatting ----
spotless = "8.10.1"
ktlint = "1.8.0"
detekt = "1.23.8"

# ---- Test ----
junit = "4.13.2"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
truth = "1.4.5"

[libraries]
# ---- Kotlin ----
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }

# ---- Compose (concrete versions come from the BOM) ----
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# ---- AndroidX ----
androidx-core = { group = "androidx.core", name = "core", version.ref = "androidxCore" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidxDatastore" }
androidx-work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "androidxWork" }

# ---- Networking ----
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
commons-compress = { group = "org.apache.commons", name = "commons-compress", version.ref = "commonsCompress" }

# ---- Test ----
junit = { group = "junit", name = "junit", version.ref = "junit" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }

# ---- Referenced from the detekt plugin configuration, not from app dependencies ----
detekt-formatting = { group = "io.gitlab.arturbosch.detekt", name = "detekt-formatting", version.ref = "detekt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
