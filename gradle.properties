# Kotlin/AGP builds are memory-hungry; the reference dev machine and the CI runner
# both have headroom for this. Lower it if you build on a constrained laptop.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# AndroidX only; no support-library translation.
android.useAndroidX=true

# Per-module R classes keep the generated R small and the build incremental.
android.nonTransitiveRClass=true

# Fail loudly rather than silently shipping a build that references a missing resource.
android.nonFinalResIds=true

kotlin.code.style=official

# The native pieces (whisper.cpp / llama.cpp) are arm64-only in practice; keeping the
# default ABI list narrow is set in app/build.gradle.kts, not here, so debug builds can
# still opt into an emulator ABI via a Gradle property.
